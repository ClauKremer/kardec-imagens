<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autorização concluída — Conteúdo Kardec</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; max-width: 640px; margin: 0 auto;
         padding: 64px 24px; line-height: 1.7; color: #1a1a1a; background: #fdfcfa;
         text-align: center; }
  h1 { font-size: 1.5em; }
  .caixa { margin: 2em 0; padding: 20px; border: 1px solid #c9a86a; border-radius: 8px;
           background: #f9f5eb; word-break: break-all; }
  .rotulo { font-size: 0.85em; color: #8a6d3b; text-transform: uppercase;
            letter-spacing: 0.05em; margin-bottom: 6px; }
  .valor { font-family: 'Courier New', monospace; font-size: 1.05em; user-select: all; }
  button { margin-top: 10px; padding: 8px 16px; border: 1px solid #8a6d3b; background: #fff;
           color: #8a6d3b; border-radius: 6px; cursor: pointer; font-family: inherit; }
  button:hover { background: #f5efe0; }
  .aviso { color: #666; font-size: 0.9em; }
</style>
</head>
<body>

<h1>Autorização recebida</h1>
<p>Copie o código abaixo e cole onde o script pedir.</p>

<div class="caixa">
  <div class="rotulo">code</div>
  <div class="valor" id="code">—</div>
  <button onclick="copiar('code')">Copiar código</button>
</div>

<div class="caixa" id="caixa-state" style="display:none">
  <div class="rotulo">state</div>
  <div class="valor" id="state">—</div>
</div>

<p class="aviso">Esta página não envia o código pra lugar nenhum — ele só aparece aqui,
na tela do seu navegador, pra você copiar manualmente.</p>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');

  if (error) {
    document.getElementById('code').textContent = 'Erro: ' + error +
      (params.get('error_description') ? ' — ' + params.get('error_description') : '');
  } else if (code) {
    document.getElementById('code').textContent = code;
  } else {
    document.getElementById('code').textContent = '(nenhum código encontrado na URL)';
  }

  if (state) {
    document.getElementById('state').textContent = state;
    document.getElementById('caixa-state').style.display = 'block';
  }

  function copiar(id) {
    const texto = document.getElementById(id).textContent;
    navigator.clipboard.writeText(texto);
  }
</script>

</body>
</html>
